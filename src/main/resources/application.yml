spring:
  application:
    name: stelloom

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stelloom}
    username: ${SPRING_DATASOURCE_USERNAME:stelloom}
    password: ${SPRING_DATASOURCE_PASSWORD:stelloom123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    # Dev-only default. Prod must override via the JWT_SECRET env var.
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars-long}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3:
      bucket: ${AWS_S3_BUCKET:stelloom-dev}
      endpoint: ${AWS_S3_ENDPOINT:}        # set only for LocalStack
      presign-expiry-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.sanskar: DEBUG

spring:
  config:
    import: optional:file:.env[.properties]
jwt:
  secret: ${JWT_SECRET}