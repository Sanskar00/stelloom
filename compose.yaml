services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=stelloom'
      - 'POSTGRES_USER=stelloom'
      - 'POSTGRES_PASSWORD=stelloom123'
    ports:
      - '5432:5432'
    volumes:
      - stelloom_pgdata:/var/lib/postgresql/data
  redis:
    image: 'redis:7'
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - stelloom_redisdata:/data

volumes:
  stelloom_pgdata:
  stelloom_redisdata: